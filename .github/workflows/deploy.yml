name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the deploy on a broken check, not after it's live.
      - run: npm run check
      - run: npm run lint
      # Vite inlines VITE_* into the bundle, so this key ends up readable in the
      # deployed JS — it is not a secret in the usual sense. The repo secret only
      # keeps it out of source control. Unset, the app falls back to demo data.
      - run: npm run build
        env:
          VITE_TMDB_KEY: ${{ secrets.TMDB_KEY }}

      # SPA fallback: a direct hit on an unknown path serves index.html instead of a 404.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
